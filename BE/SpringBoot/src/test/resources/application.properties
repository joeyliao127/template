# 測試專用設定：跑測試時 classpath 上會先找到這份，整個取代 main 的 application.properties（不是合併）。
# 所以 main 靠 Docker/.env 注入的 ${PROJECT_NAME}、${BACKEND_PORT}、${POSTGRES_*}、${JWT_SECRET} 在這裡都用不到，
# 測試需要的值要在這裡自己給；之後 main 新增了測試也會用到的設定，記得同步加進來。

# 應用程式名稱：只影響 log 顯示。server.port 不用設，MockMvc 不會真的開 port。
spring.application.name=__PROJECT_NAME__-test

# 測試用資料庫：Testcontainers 的 jdbc:tc: 網址會在 Docker 開一個跟開發環境（Docker/docker-compose-services.yaml）
# 同版本的 PostgreSQL，測試跑完就銷毀，所以跑測試需要 Docker 開著。
# 不用 H2：H2 的 PostgreSQL 相容模式不認得 TIMESTAMPTZ、部分索引（CREATE INDEX ... WHERE）、產生欄位、enum 型別等語法，
# 要用就得另外維護一份 H2 版 schema，而且測到的不是正式環境的資料庫；列鎖、條件更新、CHECK 約束這類行為也只有 PostgreSQL 測得準。
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
# prepareThreshold=0：不讓 PostgreSQL 驅動把常用查詢存成資料庫端的 prepared statement。
# 測試會產生多種 Spring context（例如加了 @AutoConfigureMockMvc、@MockBean 的 class），每開一個新 context 都會重跑 schema.sql；
# schema 有 enum 型別時，刪表重建會換掉型別，舊 context 連線池裡已經準備好的查詢下次執行會報
# 「cached plan must not change result type」。jdbc:tc 網址的查詢參數會原樣傳給驅動。
# 網址要寫成 //localhost/資料庫名：寫成 :///資料庫名 時 Testcontainers 解析不到名稱，會默默改用預設的 test。
# localhost 只是佔位，實際連線位址由 Testcontainers 決定。
spring.datasource.url=jdbc:tc:postgresql:17.10-bookworm://localhost/__PROJECT_NAME___test?prepareThreshold=0
# 帳號密碼由 Testcontainers 決定，這兩行只是讓設定完整
spring.datasource.username=test
spring.datasource.password=test

# 啟動時建表並放入測試資料
# schema.sql 直接讀 Database/ 底下正式的那一份（不另存一份，避免兩份不同步；路徑相對於 BE/SpringBoot）；
# data.sql 是測試專用的小份固定資料（src/test/resources/data.sql），不是 Database/data.sql 那份正式種子資料。
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:../../Database/schema.sql
spring.sql.init.data-locations=classpath:data.sql

# 測試專用 JWT 金鑰（base64，解開超過 32 bytes，HS256 夠長），不是正式環境的值
jwt.secret.key=dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LTMyLWJ5dGVzISE=
